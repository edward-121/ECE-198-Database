<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Exercise Care Records{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #23313d; background: #f4f7f8; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1120px; margin: 24px auto; padding: 0 20px; }
    h1, h2, h3 { color: #203d4b; }
    a { color: #086c72; }
    .card { background: white; border: 1px solid #dce5e8; border-radius: 8px; padding: 18px; margin: 16px 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .muted { color: #5d6b73; }
    .button { display: inline-block; padding: 9px 13px; border-radius: 5px; background: #086c72; color: white; text-decoration: none; border: 0; cursor: pointer; }
    .button.secondary { background: #e7f0f1; color: #174e53; }
    table { border-collapse: collapse; width: 100%; background: white; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #dce5e8; vertical-align: top; }
    th { background: #edf3f4; }
    label { font-weight: bold; }
    input, select, textarea { max-width: 100%; padding: 8px; border: 1px solid #b9c9ce; border-radius: 4px; }
    .flash { padding: 10px 14px; border-radius: 5px; background: #e3f4eb; margin: 12px 0; }
    .errors { color: #a32626; }
    @media (max-width: 600px) { main { padding: 0 12px; } table { font-size: .9rem; } }
    {% block styles %}{% endblock %}
  </style>
</head>
<body>
  {% include "navigation.html" %}
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
